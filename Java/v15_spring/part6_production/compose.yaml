# La aplicación empaquetada con Docker Compose (packaging/PackagingAndDocker, CAPA 8).
# Desde part6_production/, con el jar ya construido (./mvnw -pl part6_production package):
#     docker compose up -d --build        levantar (y reconstruir la imagen)
#     docker compose ps                   ver el estado
#     docker compose logs -f tienda       seguir los logs
#     docker compose down                 bajar y borrar los contenedores
services:
  tienda:
    build: .
    image: tienda
    ports:
      - "8080:8080"                       # puerto de tu máquina : puerto del contenedor
    environment:                          # la configuración entra por variables (CAPA 2)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    mem_limit: 512m                       # la JVM lo lee y ajusta el heap (CAPA 5)
    stop_grace_period: 40s                # MÁS que los 30 s de Spring por fase de apagado (CAPA 5)
    restart: unless-stopped

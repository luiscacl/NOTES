# Configuración de la aplicación empaquetada (packaging/PackagingAndDocker). Tiene su propio
# nombre (spring.config.name=packaged-shop) para no mezclarse con las otras guías del módulo.
# En el contenedor, todo esto se puede cambiar con variables de entorno (CAPA 5).
spring.application.name=tienda
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Configuración de la tienda. Lo que cambia por ambiente (base de datos, llaves, contraseña del
# administrador) NO está aquí: entra por variables de entorno (ver compose.yaml y README.md).
spring:
  application:
    name: tienda
  jpa:
    open-in-view: false            # sin consultas escondidas al armar el JSON (README, "Decisiones")
    hibernate:
      ddl-auto: validate           # el esquema lo crea Flyway; Hibernate solo revisa que coincida
  mvc:
    problemdetails:
      enabled: true                # errores de Spring MVC como ProblemDetail (RFC 9457)
  data:
    web:
      pageable:
        max-page-size: 50          # ?size=100000 no tumba la base

shop:
  jwt:
    issuer: https://tienda.example
    ttl: PT15M
    # public-key / private-key: rutas a archivos PEM, p. ej. file:/run/secrets/jwt-public.pem
    # ephemeral-keys: true         solo en desarrollo y pruebas
  admin:
    username: admin
    # password: desde la variable SHOP_ADMIN_PASSWORD; sin ella no se crea el administrador

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
